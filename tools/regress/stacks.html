<!doctype html>
<!-- Compiles and renders multi-shape stacks with the current build: every shape type twice (the
     per-layer renaming), mixed stacks up to four shapes, and a stack with every shape hidden.
     Run with tools/regress/stacks.mjs. -->
<meta charset="utf-8" />
<script type="module">
  import { snapshot } from '/packages/lazuli/dist/capture.js'
  import { applyOp, configToStack, resolveConfig } from '/packages/lazuli/dist/lazuli.js'

  const W = 320, H = 200
  const opts = (stack) => ({ width: W, height: H, pixelRatio: W / 1280, time: 2, stack })
  const base = (type) => configToStack(resolveConfig({ shape: { type }, texture: { type: 'none' } }))
  const add = (s, type) => {
    const r = applyOp(s, { op: 'add', layer: 'shape', type })
    if (!r.ok) throw new Error(r.error)
    return r.stack
  }

  async function pixels(blob) {
    const bmp = await createImageBitmap(blob)
    const c = new OffscreenCanvas(bmp.width, bmp.height)
    const g = c.getContext('2d')
    g.drawImage(bmp, 0, 0)
    return g.getImageData(0, 0, bmp.width, bmp.height).data
  }
  const differs = (a, b) => a.some((v, i) => Math.abs(v - b[i]) > 2)

  window.done = (async () => {
    const out = []
    const run = async (name, check) => {
      try {
        const note = await check()
        out.push({ case: name, ok: note === true, note: note === true ? '' : note })
      } catch (e) {
        out.push({ case: name, ok: false, note: String(e.message ?? e) })
      }
    }

    // Two of the same type: the second shape must compile and change the image.
    for (const t of ['blobs', 'waves', 'bands', 'rings', 'dots', 'nodal']) {
      await run(`twice:${t}`, async () => {
        const one = base(t)
        const two = add(one, t)
        two.shapes[0].seed = 424242
        const [a, b] = await Promise.all([snapshot({}, opts(one)).then(pixels), snapshot({}, opts(two)).then(pixels)])
        return differs(a, b) || 'second shape changed nothing'
      })
    }

    await run('mixed:blobs+waves', async () => {
      const s = add(base('blobs'), 'waves')
      const [a, b] = await Promise.all([snapshot({}, opts(base('blobs'))).then(pixels), snapshot({}, opts(s)).then(pixels)])
      return differs(a, b) || 'waves changed nothing'
    })

    await run('mixed:four', async () => {
      let s = base('blobs')
      for (const t of ['waves', 'rings', 'nodal']) s = add(s, t)
      await snapshot({}, opts(s))
      return s.shapes.length === 4 || `expected 4 shapes, got ${s.shapes.length}`
    })

    await run('hidden:all', async () => {
      const s = base('blobs')
      s.shapes[0].visible = false
      const p = await snapshot({}, opts(s)).then(pixels)
      // Background only: plain white.
      for (let i = 0; i < p.length; i += 4) if (p[i] < 250 || p[i + 1] < 250 || p[i + 2] < 250) return 'pixels other than the background'
      return true
    })

    await run('texture:halftone+2 shapes', async () => {
      const s = add(configToStack(resolveConfig({ texture: { type: 'halftone' } })), 'rings')
      await snapshot({}, opts(s))
      return true
    })

    // Combine modes: a Rings layer in front of the default Blobs.
    const covered = (p) => {
      let n = 0
      for (let i = 0; i < p.length; i += 4) if (p[i] < 240 || p[i + 1] < 240 || p[i + 2] < 240) n++
      return n
    }
    const pair = (mode, front = 'rings') => {
      const s = add(base('blobs'), front)
      s.shapes[0].combine = mode
      return s
    }
    const shot = (s) => snapshot({}, opts(s)).then(pixels)
    const [back, over, cut, inter, plus] = await Promise.all([shot(base('blobs')), shot(pair('merge')), shot(pair('cut')), shot(pair('intersect')), shot(pair('add'))])
    await run('combine:cut removes', async () => covered(cut) < covered(back) || `cut ${covered(cut)} ≥ blobs alone ${covered(back)}`)
    await run('combine:intersect keeps less', async () => covered(inter) < covered(back) || `intersect ${covered(inter)} ≥ blobs alone ${covered(back)}`)
    // Cut and Intersect only take away: where the Blobs alone show background, both stay background.
    await run('combine:cut/intersect add nothing', async () => {
      for (let i = 0; i < back.length; i += 4) {
        if (back[i] < 250 || back[i + 1] < 250 || back[i + 2] < 250) continue
        for (const [name, p] of [['cut', cut], ['intersect', inter]]) if (p[i] < 248 || p[i + 1] < 248 || p[i + 2] < 248) return `${name} drew outside the shapes below`
      }
      return true
    })
    await run('combine:add differs from merge', async () => differs(plus, over) || 'add looks like merge')
    await run('combine:liquid merge', async () => {
      const melt = add(base('blobs'), 'blobs')
      melt.shapes[0].seed = 99
      const apart = structuredClone(melt)
      apart.shapes[0].combine = 'add'
      const [a, b] = await Promise.all([shot(melt), shot(apart)])
      return differs(a, b) || 'merged blobs look like stacked blobs'
    })

    // Warps: each one bends its shape; they loop seamlessly; a cursor can live on one shape.
    const warped = (type, strength = 70) => {
      const r = applyOp(base('waves'), { op: 'add', layer: 'warp', type, parent: 'shape-1' })
      if (!r.ok) throw new Error(r.error)
      const t = applyOp(r.stack, { op: 'tune', id: 'warp-1', strength })
      if (!t.ok) throw new Error(t.error)
      return t.stack
    }
    const plain = await shot(base('waves'))
    for (const type of ['swirl', 'noise', 'ripple']) {
      await run(`warp:${type} bends`, async () => differs(await shot(warped(type)), plain) || `${type} changed nothing`)
      await run(`warp:${type} loops`, async () => {
        const s = warped(type)
        s.motion = { ...s.motion, loop: 6, speed: 0.5 }
        const period = 6 * 0.5
        const [a, b] = await Promise.all([snapshot({}, { ...opts(s), time: 0 }).then(pixels), snapshot({}, { ...opts(s), time: period }).then(pixels)])
        let max = 0
        for (let i = 0; i < a.length; i++) max = Math.max(max, Math.abs(a[i] - b[i]))
        return max <= 2 || `seam ${max}/255`
      })
    }
    await run('warp:cursor on a shape', async () => {
      let s = base('blobs')
      for (const op of [{ op: 'delete', id: 'cursor' }, { op: 'add', layer: 'shape', type: 'rings' }, { op: 'add', layer: 'cursor', parent: 'shape-1' }]) {
        const r = applyOp(s, op)
        if (!r.ok) throw new Error(r.error)
        s = r.stack
      }
      await shot(s)
      return true
    })
    await run('warp:two per shape, four shapes', async () => {
      let s = base('blobs')
      for (const t of ['waves', 'rings', 'nodal']) s = add(s, t)
      for (const [id, type] of [['shape-1', 'swirl'], ['shape-1', 'noise'], ['shape-2', 'ripple'], ['shape-3', 'swirl']]) {
        const r = applyOp(s, { op: 'add', layer: 'warp', type, parent: id })
        if (!r.ok) throw new Error(r.error)
        s = r.stack
      }
      await shot(s)
      return true
    })

    // ---- drawn layers: sample known points (height units, center origin, y up) ----
    const drawnOnly = (...geoms) => {
      let s = configToStack(resolveConfig({ texture: { type: 'none' } }))
      for (const geom of geoms.reverse()) {
        const r = applyOp(s, { op: 'add', layer: 'drawn', geom })
        if (!r.ok) throw new Error(r.error)
        s = r.stack
      }
      const r = applyOp(s, { op: 'delete', id: 'shape-1' })
      if (!r.ok) throw new Error(r.error)
      s = r.stack
      s.shapes.forEach((x) => (x.soft = 0))
      return s
    }
    const at = (p, x, y) => {
      const px = Math.round(W / 2 + x * H), py = Math.round(H / 2 - y * H)
      const i = (py * W + px) * 4
      return p[i] < 235 || p[i + 1] < 235 || p[i + 2] < 235 // true = colored, false = background
    }
    const E = (x, y, r) => ({ kind: 'ellipse', x, y, rx: r, ry: r, angle: 0 })
    await run('drawn:ellipse in and out', async () => {
      const p = await shot(drawnOnly(E(0.2, 0.1, 0.12)))
      return (at(p, 0.2, 0.1) && !at(p, -0.4, -0.3) && !at(p, 0.2, 0.25)) || 'wrong inside/outside'
    })
    await run('drawn:melt fills the gap', async () => {
      const hard = drawnOnly(E(-0.13, 0, 0.1), E(0.13, 0, 0.1))
      hard.shapes.forEach((x) => (x.melt = 0))
      const soft = structuredClone(hard)
      soft.shapes.forEach((x) => (x.melt = 1))
      const [a, b] = await Promise.all([shot(hard), shot(soft)])
      // The gap between the two circles, just above the line joining them.
      return (!at(a, 0, 0.06) && at(b, 0, 0.06)) || `hard ${at(a, 0, 0.06)}, melted ${at(b, 0, 0.06)}`
    })
    await run('drawn:cut bites, intersect keeps the overlap', async () => {
      const big = E(0, 0, 0.2), bite = E(0.18, 0, 0.12)
      const cut = drawnOnly(bite, big), inter = drawnOnly(bite, big)
      cut.shapes[0].combine = 'cut'
      inter.shapes[0].combine = 'intersect'
      cut.shapes.forEach((x) => (x.melt = 0))
      inter.shapes.forEach((x) => (x.melt = 0))
      const [c, i] = await Promise.all([shot(cut), shot(inter)])
      const okCut = at(c, -0.1, 0) && !at(c, 0.15, 0)
      const okInter = at(i, 0.15, 0) && !at(i, -0.1, 0) && !at(i, 0.27, 0)
      return (okCut && okInter) || `cut ${okCut}, intersect ${okInter}`
    })
    await run('drawn:star and concave L paths', async () => {
      const star = Array.from({ length: 10 }, (_, k) => {
        const a = Math.PI / 2 + (k * Math.PI) / 5, r = k % 2 ? 0.08 : 0.2
        return [-0.35 + r * Math.cos(a), r * Math.sin(a)]
      })
      const L = [[0.15, 0.2], [0.25, 0.2], [0.25, -0.1], [0.45, -0.1], [0.45, -0.2], [0.15, -0.2]]
      const p = await shot(drawnOnly({ kind: 'path', points: star }, { kind: 'path', points: L }))
      const starOk = at(p, -0.35, 0) && at(p, -0.35, 0.17) && !at(p, -0.35 + 0.15 * Math.cos(Math.PI / 2 + Math.PI / 5), 0.15 * Math.sin(Math.PI / 2 + Math.PI / 5))
      const lOk = at(p, 0.2, 0.1) && at(p, 0.4, -0.15) && !at(p, 0.38, 0.1)
      return (starOk && lOk) || `star ${starOk}, L ${lOk}`
    })

    return out
  })()
</script>

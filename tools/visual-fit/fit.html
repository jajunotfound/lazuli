<!doctype html>
<canvas id="c" width="320" height="208"></canvas>
<script>
// Pixel fit with the new uniform-driven layout. Knobs: rscale (size mapping), soft, clo/chi.
const W = 320, H = 208
const FS = `
precision highp float;
uniform vec2 u_res; uniform float u_time; uniform float u_count; uniform float u_size;
uniform float u_soft; uniform float u_clo; uniform float u_chi; uniform float u_k;
uniform vec4 u_blob[6]; uniform vec4 u_orbit[6];
uniform vec3 u_deep; uniform vec3 u_mid; uniform vec3 u_bg;
float hash(float n){ return fract(sin(n) * 43758.5453123); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  float a = hash(dot(i, vec2(1.0,57.0))); float b = hash(dot(i+vec2(1.0,0.0), vec2(1.0,57.0)));
  float c = hash(dot(i+vec2(0.0,1.0), vec2(1.0,57.0))); float d = hash(dot(i+vec2(1.0,1.0), vec2(1.0,57.0)));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y); }
void main(){
  float aspect = u_res.x / u_res.y; vec2 uv = gl_FragCoord.xy / u_res; vec2 p = vec2(uv.x * aspect, uv.y);
  float t = u_time;
  p += 0.035 * vec2(noise(p*3.0 + t*0.4), noise(p*3.0 - t*0.4 + 7.0)) - 0.0175;
  float field = 0.0;
  for (int i = 0; i < 6; i++){ if (float(i) >= u_count) break;
    vec4 b = u_blob[i]; vec4 o = u_orbit[i];
    float p1 = o.w; float p2 = o.w * 1.3 + 1.7; float p3 = o.w * 0.7 + 2.9;
    vec2 c = vec2(b.x * aspect, b.y) + vec2(sin(t*o.x + p1) - sin(p1), cos(t*o.y + p2) - cos(p2)) * o.z;
    float r = b.z * u_size;
    vec2 q = p - c; q.x *= b.w * (1.0 + 0.12 * (sin(t*0.3 + p3) - sin(p3)));
    field += exp(-pow(dot(q,q) / (r*r) + 1e-6, u_k)); }
  float lo = 0.5 - u_soft*0.45; float hi = 0.5 + u_soft*0.45;
  float e = smoothstep(lo, hi, field); float core = smoothstep(u_clo, u_chi, field);
  vec3 col = mix(u_bg, u_mid, e); col = mix(col, u_deep, core);
  col = mix(col, u_bg * 1.02, smoothstep(0.55, 1.0, length(uv - 0.5)) * 0.35);
  gl_FragColor = vec4(col, 1.0);
}`
const gl = document.getElementById('c').getContext('webgl', { preserveDrawingBuffer: true })
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s }
const prog = gl.createProgram()
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'))
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS))
gl.linkProgram(prog); gl.useProgram(prog)
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)
const U = (n) => gl.getUniformLocation(prog, n)
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255)
let RW = W, RH = H
gl.viewport(0, 0, W, H); gl.uniform2f(U('u_res'), W, H)
gl.uniform1f(U('u_time'), 0); gl.uniform1f(U('u_count'), 3)
gl.uniform3fv(U('u_deep'), hex('#1f48a8')); gl.uniform3fv(U('u_mid'), hex('#4c78d8')); gl.uniform3fv(U('u_bg'), hex('#ffffff'))

let layouts, ref
const px = new Uint8Array(1280 * 832 * 4)
function render(p) {
  const L = layouts[p.seed]
  const blob = Float32Array.from(L.blob)
  if (p.geo) for (let i = 0; i < 12; i++) blob[i] = p.geo[i]
  gl.uniform4fv(U('u_blob'), blob); gl.uniform4fv(U('u_orbit'), L.orbit)
  gl.uniform1f(U('u_size'), p.rscale); gl.uniform1f(U('u_soft'), p.soft)
  gl.uniform1f(U('u_clo'), p.clo); gl.uniform1f(U('u_chi'), p.chi); gl.uniform1f(U('u_k'), p.k ?? 1)
  gl.drawArrays(gl.TRIANGLES, 0, 3)
  gl.readPixels(0, 0, RW, RH, gl.RGBA, gl.UNSIGNED_BYTE, px)
}
function score(p) {
  render(p)
  let err = 0
  for (let y = 0; y < H; y++) { const gy = H - 1 - y
    for (let x = 0; x < W; x++) { const i = (gy * W + x) * 4, j = (y * W + x) * 4
      for (let k = 0; k < 3; k++) { const d = px[i + k] - ref[j + k]; err += d * d } } }
  return err / (W * H * 3)
}
async function load() {
  layouts = await (await fetch('layouts.json')).json()
  const img = new Image(); img.src = 'paper-ref.png'; await img.decode()
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H
  const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, W, H); ref = cx.getImageData(0, 0, W, H).data
}
window.show = async (p) => {
  await load()
  const c = document.getElementById('c'); c.width = 1280; c.height = 832; c.style.cssText = 'position:fixed;inset:0'
  RW = 1280; RH = 832; gl.viewport(0, 0, 1280, 832); gl.uniform2f(U('u_res'), 1280, 832)
  render(p); return 'shown'
}
window.runFit = async () => {
  await load()
  const steps = { rscale: 0.04, soft: 0.05, clo: 0.05, chi: 0.1, k: 0.1 }
  const bounds = { rscale: [0.5, 1.6], soft: [0.02, 1.1], clo: [0.0, 1.5], chi: [0.3, 3], k: [1, 3] }
  const results = []
  for (const seed of Object.keys(layouts)) {
    let p = { seed, rscale: 0.95, soft: 1.05, clo: 0.5, chi: 1.39, k: 1.44 }, best = score(p)
    for (let round = 0; round < 12; round++) {
      let improved = false
      for (const k of Object.keys(steps)) for (const dir of [-1, 1]) for (const m of [4, 2, 1, 0.5]) {
        const q = { ...p, [k]: Math.min(bounds[k][1], Math.max(bounds[k][0], p[k] + dir * steps[k] * m)) }
        const s = score(q); if (s < best) { best = s; p = q; improved = true }
      }
      if (!improved) break
    }
    results.push([Math.round(best * 10) / 10, p])
  }
  results.sort((a, b) => a[0] - b[0])
  return JSON.stringify(results.slice(0, 5))
}

window.runGeo = async (seed, init) => {
  await load()
  let p = { ...init, seed, geo: layouts[seed].blob.slice(0, 12) }
  let best = score(p)
  const knobs = { rscale: [0.02, 0.5, 1.6], soft: [0.03, 0.02, 1.1], clo: [0.05, 0, 1.5], chi: [0.08, 0.3, 3], k: [0.08, 1, 3] }
  const geoStep = [0.01, 0.01, 0.01, 0.04]
  for (let round = 0; round < 25; round++) {
    let improved = false
    for (const [k, [st, lo, hi]] of Object.entries(knobs)) for (const dir of [-1, 1]) for (const m of [2, 1, 0.5]) {
      const q = { ...p, [k]: Math.min(hi, Math.max(lo, p[k] + dir * st * m)) }
      const s = score(q); if (s < best) { best = s; p = q; improved = true }
    }
    for (let i = 0; i < 12; i++) for (const dir of [-1, 1]) for (const m of [2, 1, 0.5]) {
      const g = p.geo.slice(); g[i] += dir * geoStep[i % 4] * m
      if (i % 4 === 2 && g[i] < 0.02) continue
      const q = { ...p, geo: g }
      const s = score(q); if (s < best) { best = s; p = q; improved = true }
    }
    if (!improved) break
  }
  return JSON.stringify([Math.round(best * 10) / 10, p])
}
</script>

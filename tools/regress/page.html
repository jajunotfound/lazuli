<!doctype html>
<!-- Renders one engine build full-window for screenshots.
     ?engine=<path to lazuli.global.js>&opts=<JSON options for createLazuli> -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>html, body { margin: 0; height: 100%; background: #808080; } #bg { position: fixed; inset: 0; }</style>
<div id="bg"></div>
<script>
  const q = new URLSearchParams(location.search)
  const s = document.createElement('script')
  s.src = q.get('engine') || '/packages/lazuli/dist/lazuli.global.js'
  s.onload = () => {
    window.bg = Lazuli.createLazuli(document.getElementById('bg'), JSON.parse(q.get('opts') || '{}'))
  }
  document.head.append(s)
</script>
